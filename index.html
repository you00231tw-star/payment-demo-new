<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Demo Step 1</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #ffffff;
      color: #111;
    }

    .page {
      display: none;
      min-height: 100vh;
      padding: 80px 20px 120px;
      text-align: center;
    }

    .page.active {
      display: block;
    }

    .page h1 {
      font-size: 34px;
      margin: 0;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 88px;
      background: #fff;
      border-top: 1px solid #ddd;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: #999;
      font-size: 15px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: #78b81c;
      font-weight: 700;
    }
    /* ===== 首頁外觀 ===== */

#home {
  padding: 0 0 110px 0;
  text-align: left;
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  background: #ffffff;
  min-height: 100vh;
}


/* 黃色頂部 */

/* ===== 首頁頂部黃色區域 ===== */

.home-header {

  height: 215px;

  background: #fff995;

  position: relative;

  display: flex;

  justify-content: center;

  align-items: flex-end;

  padding-bottom: 48px;

  overflow: visible;

  border-radius:
    0 0 55% 55% /
    0 0 35% 35%;

  box-shadow:
    0 5px 10px
    rgba(0,0,0,0.12);
}


/* EasyPay */

.home-logo {

  font-size: 34px;

  font-weight: 900;

  color: #69ad1b;

  letter-spacing: -1px;
}


/* 右邊廣播按鈕 */

.home-notice-icon {

  position: absolute;

  right: -18px;

  bottom: -3px;

  width: 82px;

  height: 82px;

  background: #fffef1;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 31px;

  color: #69ad1b;

  box-shadow:
    0 4px 10px
    rgba(0,0,0,0.10);
}


/* 首頁內容 */

.home-content {
  padding: 38px 26px;
}


/* 最新消息 / 最新活動 */

.home-content h2 {
  text-align: center;

  font-size: 25px;

  margin:
    0 0 18px 0;
}


/* 黑色消息卡 */

.news-card {
  min-height: 120px;

  border-radius: 15px;

  padding: 20px 18px;

  background:
    linear-gradient(
      120deg,
      #07090d,
      #10243d
    );

  color: white;

  display: flex;

  justify-content: space-between;

  align-items: center;

  box-shadow:
    0 5px 12px
    rgba(0,0,0,0.20);
}


.news-title {
  font-size: 21px;

  margin-bottom: 15px;
}


.news-description {
  font-size: 14px;

  line-height: 1.6;
}


.news-lock {
  font-size: 40px;

  margin-right: 12px;
}


/* 兩個小圓點 */

.slider-dots {
  height: 42px;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 8px;
}


.slider-dots span {
  width: 13px;
  height: 13px;

  border-radius: 50%;

  background: #d7eab6;
}


.slider-dots span:first-child {
  background: #74b51d;
}


/* 活動卡片 */

.activity-card {
  background: white;

  border-radius: 16px;

  padding: 18px;

  margin-bottom: 30px;

  box-shadow:
    0 3px 14px
    rgba(0,0,0,0.14);
}


.activity-title {
  color: #70b329;

  font-size: 21px;

  font-weight: bold;

  line-height: 1.4;
}


.activity-date {
  color: #888888;

  font-size: 17px;

  margin:
    5px 0 15px 0;
}


/* 暫時的活動圖片 */

.activity-image {
  height: 175px;

  border: 5px double #4d7542;

  background: #fffdf0;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  font-size: 25px;

  font-weight: bold;

  line-height: 1.7;
}


.activity-image.dark {
  height: 130px;

  background: #142338;

  color: white;

  border: none;
}


/* ===== 底部導覽調整 ===== */

.bottom-nav {
  max-width: 430px;

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 100;
}
  </style>
</head>

<body>
<section id="home" class="page active">

  <div class="home-header">

    <div class="home-logo">
      EasyPay
    </div>

    <div class="home-notice-icon">
      📢
    </div>

  </div>


  <div class="home-content">

    <h2>
      最新消息
    </h2>

    <div class="news-card">

      <div class="news-text">

        <div class="news-title">
          反詐騙提醒
        </div>

        <div class="news-description">
          請勿任意交付金融卡及個資，<br>
          若有疑問請來電本公司求證
        </div>

      </div>

      <div class="news-lock">
        🔒
      </div>

    </div>


    <div class="slider-dots">

      <span></span>
      <span></span>

    </div>


    <h2>
      最新活動
    </h2>


    <div class="activity-card">

      <div class="activity-title">
        追蹤和潤FB及IG不定期抽獎等你參加
      </div>

      <div class="activity-date">
        2026.08.07 - 2026.08.10
      </div>

      <div class="activity-image">

        歡慶父親節<br>
        留言抽好禮

      </div>

    </div>


    <div class="activity-card">

      <div class="activity-title">
        和潤企業反詐騙提醒
      </div>

      <div class="activity-date">
        2024.10.29
      </div>

      <div class="activity-image dark">

        防詐騙提醒

      </div>

    </div>

  </div>

</section>

  <section id="points" class="page">
    <h1>輕鬆分</h1>
  </section>

  <section id="payment" class="page">
    <h1>輕鬆付</h1>
  </section>

  <section id="question" class="page">
    <h1>輕鬆問</h1>
  </section>

  <section id="profile" class="page">
    <h1>個人</h1>
  </section>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="showPage('home', this)">首頁</button>
    <button class="nav-btn" onclick="showPage('points', this)">輕鬆分</button>
    <button class="nav-btn" onclick="showPage('payment', this)">輕鬆付</button>
    <button class="nav-btn" onclick="showPage('question', this)">輕鬆問</button>
    <button class="nav-btn" onclick="showPage('profile', this)">個人</button>
  </nav>

  <script>
    function showPage(pageId, button) {
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });

      document.getElementById(pageId).classList.add('active');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      button.classList.add('active');
    }
  </script>
</body>
</html>
